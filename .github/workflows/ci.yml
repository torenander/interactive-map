name: CI

# `push` is scoped to main so a PR branch runs its gates once. Unscoped, a PR
# gets both a push event and a pull_request event, and the concurrency group below
# does not dedupe them: the two carry different `github.ref` values
# (refs/heads/<branch> vs refs/pull/<n>/merge), so they land in different groups and
# both run. That doubled every Docker pull and hit ECR rate limits on PR #2.
# Pushes to main still trigger CI exactly as before.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pmtiles CLI (for scripts/fetch-tiles.sh)
        run: |
          curl -sSL -o /tmp/pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf /tmp/pmtiles.tar.gz -C /tmp pmtiles
          sudo install /tmp/pmtiles /usr/local/bin/pmtiles
          pmtiles version

      - name: Compute tile cache key from bbox/maxzoom constants
        id: tile-key
        run: |
          HASH=$(grep -E '^(BBOX|MAXZOOM)=' scripts/fetch-tiles.sh | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # Keyed on the bbox+maxzoom constants (not the whole script) so an
      # unrelated script edit doesn't force re-downloading ~131MB from
      # Protomaps' free daily-build service.
      - name: Cache London tiles extract
        id: tiles-cache
        uses: actions/cache@v4
        with:
          path: public/tiles/london.pmtiles
          key: london-pmtiles-${{ steps.tile-key.outputs.hash }}

      - name: Fetch London tiles (cache miss only)
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-tiles.sh

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (webkit for e2e, chromium for assert-pwa)
        run: npx playwright install --with-deps webkit chromium

      - name: supabase start (db + edge runtime)
        run: npx supabase start

      - name: Write .env from local stack (supabase status -o env)
        run: |
          API_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d'=' -f2- | tr -d '"')
          ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d'=' -f2- | tr -d '"')
          echo "VITE_SUPABASE_URL=$API_URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env

      - name: Gate — npx supabase db reset
        run: npx supabase db reset

      - name: Gate — generated types match src/db/types.ts
        run: npx supabase gen types typescript --local | diff - src/db/types.ts

      - name: Gate — npm run build
        run: npm run build

      - name: Gate — npm run test (unit)
        run: npm run test

      # Two steps, not one invocation. Since the desktop project landed, a bare
      # `npm run test:e2e` runs BOTH projects together — 65 tests where 27 used to
      # run — at default parallelism on a two-core runner. docs/TESTING.md records
      # why that fails: the suite assumes exclusive access to the machine and to
      # dist/, and desktop Chromium at 1440x900 costs far more per worker than
      # WebKit at 390x844. Measured locally, the desktop project at default workers
      # failed 1 run in 2; at --workers=1 it was clean across 13 runs.
      #
      # Splitting also keeps a failure attributable: one step per project says which
      # lane broke without reading the matrix.
      - name: Gate — npm run test:e2e (mobile project)
        run: npm run test:e2e -- --project=mobile 2>&1 | tee /tmp/e2e-mobile.log; exit ${PIPESTATUS[0]}

      # --workers=1 per docs/OBJECTIVES.md § G11's amended done_when. The flag is the
      # gate, not a speed knob: without it this lane fails intermittently on merit,
      # which teaches people to re-run CI, which is how a real failure gets waved
      # through.
      - name: Gate — npm run test:e2e (desktop project)
        run: npm run test:e2e -- --project=desktop --workers=1 2>&1 | tee /tmp/e2e-desktop.log; exit ${PIPESTATUS[0]}

      # A test that fails and then passes on retry is not a pass. playwright.config.ts
      # sets retries: 2 under CI, so without this step a flaky test is indistinguishable
      # from a solid one in the build result — and the whole point of the retry is to
      # stop one transient failing a release, not to hide that it happened.
      #
      # This is deliberately NOT "set retries to 0". Both make the build red, but this
      # one says WHICH kind of red: a hard failure and a flaky pass look identical at
      # retries: 0, and the difference is the first thing anyone diagnosing it needs.
      # Keeping the retry also keeps its diagnostic value — you learn the test can pass,
      # which rules out a deterministic break.
      #
      # Recorded because it was invisible for weeks: docs/TESTING.md's measurement
      # section has the three harnesses that reported confident numbers while measuring
      # nothing, and a green build hiding a retried pass is the same failure wearing CI's
      # clothes.
      - name: Gate — no test passed only on retry
        if: always()
        run: |
          flaky=0
          for log in /tmp/e2e-mobile.log /tmp/e2e-desktop.log; do
            [ -f "$log" ] || continue
            n=$(grep -cE "^\s+[0-9]+ flaky" "$log" || true)
            if [ "$n" -gt 0 ]; then
              echo "::error::$(basename "$log" .log): tests passed only on retry"
              grep -E "flaky|✘" "$log" | head -20
              flaky=1
            fi
          done
          [ "$flaky" -eq 0 ] && echo "no test needed a retry"
          exit $flaky

      - name: Gate — node scripts/assert-pwa.mjs
        run: node scripts/assert-pwa.mjs

      - name: supabase stop
        if: always()
        run: npx supabase stop
